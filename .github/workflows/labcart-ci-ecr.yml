
name: LabCart CI and ECR

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "Infra/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labcart-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "223901279187"

jobs:
  validate:
    name: Validate applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build worker
        run: npm --workspace apps/worker run build

      - name: Lint web
        run: npm --workspace apps/web run lint

      - name: Build web
        run: npm --workspace apps/web run build

  build-scan-push:
    name: Build, scan and push ${{ matrix.app }}
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            repository: labcart/api
          - app: web
            repository: labcart/web
          - app: worker
            repository: labcart/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image details
        id: image
        shell: bash
        run: |
          echo "uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.repository }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --file "apps/${{ matrix.app }}/Dockerfile" \
            --tag "${{ steps.image.outputs.uri }}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image to ECR
        run: docker push "${{ steps.image.outputs.uri }}"
