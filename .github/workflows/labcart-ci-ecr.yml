name: LabCart CI and ECR

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "Infra/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labcart-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "223901279187"
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate applications
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build worker
        run: npm --workspace apps/worker run build

      - name: Lint web
        run: npm --workspace apps/web run lint

      - name: Build web
        run: npm --workspace apps/web run build

  build-push:
    name: Build and push ${{ matrix.app }}
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            repository: labcart/api
          - app: web
            repository: labcart/web
          - app: worker
            repository: labcart/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: LabCartGitHubActions

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        env:
          ECR_REPOSITORY: ${{ matrix.repository }}
        run: |
          echo "uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.image.outputs.uri }}
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Publish summary
        if: success()
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          {
            echo "## LabCart — ${{ matrix.app }}"
            echo ""
            echo "- **Status:** Success"
            echo "- **Docker build:** Passed"
            echo "- **ECR push:** Completed"
            echo "- **Security scan:** Skipped"
            echo "- **Image:** \`${IMAGE_URI}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          echo "Build or ECR publishing failed for ${{ matrix.app }}." >> "$GITHUB_STEP_SUMMARY"