
name: LabCart CI and ECR

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "Infra/**"
      - "deploy/k8s/overlays/prod/kustomization.yaml"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labcart-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "223901279187"
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate applications
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build worker
        run: npm --workspace apps/worker run build

      - name: Lint web
        run: npm --workspace apps/web run lint

      - name: Build web
        run: npm --workspace apps/web run build

  build-push:
    name: Build and push ${{ matrix.app }}
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            repository: labcart/api
          - app: web
            repository: labcart/web
          - app: worker
            repository: labcart/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: LabCartGitHubActions

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        env:
          ECR_REPOSITORY: ${{ matrix.repository }}
        run: |
          echo "uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.image.outputs.uri }}
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Publish summary
        if: success()
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          {
            echo "## LabCart — ${{ matrix.app }}"
            echo ""
            echo "- **Status:** Success"
            echo "- **Docker build:** Passed"
            echo "- **ECR push:** Completed"
            echo "- **Security scan:** Skipped"
            echo "- **Image:** \`${IMAGE_URI}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          echo "Build or ECR publishing failed for ${{ matrix.app }}." >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    name: Create production image update PR
    needs: build-push
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update production image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/k8s/overlays/prod/kustomization.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]
          account_id = os.environ["AWS_ACCOUNT_ID"]
          region = os.environ["AWS_REGION"]

          for repository in ("api", "web", "worker"):
              image_name = (
                  f"{account_id}.dkr.ecr.{region}.amazonaws.com/"
                  f"labcart/{repository}"
              )

              pattern = (
                  r"(?m)^(\s*-\s*name:\s*"
                  + re.escape(image_name)
                  + r"\s*\n)(\s+newTag:\s*)[^\s#]+"
              )

              content, count = re.subn(
                  pattern,
                  lambda match: match.group(1)
                  + match.group(2)
                  + tag,
                  content,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one image entry for "
                      f"{repository} in {path}. No PR will be created."
                  )

          path.write_text(content)
          PY

      - name: Create or update GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: automation/update-production-image-tags
          delete-branch: false
          commit-message: "chore(gitops): update production image tags"
          title: "chore(gitops): update production image tags"
          body: |
            ## Automated production image update

            This pull request was generated after successful image builds
            and ECR pushes.

            - API, web, and worker use the source commit SHA.
            - All three image tags are updated together.
            - Review the rendered Kubernetes manifests before merging.
            - Argo CD production synchronization remains manual.
