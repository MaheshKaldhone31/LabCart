
name: LabCart CI and ECR

# ─────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "Infra/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Least-privilege default permissions.
permissions:
  contents: read

# Cancel outdated runs for the same branch or ref.
concurrency:
  group: labcart-ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────
# Shared configuration
# ─────────────────────────────────────────────
env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "223901279187"
  NODE_VERSION: "22"

jobs:
  # ═══════════════════════════════════════════
  # JOB 1 — Validate applications
  # ═══════════════════════════════════════════
  validate:
    name: "1. Validate applications"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: |
          echo "::group::Building API"
          npm --workspace apps/api run build
          echo "::endgroup::"

      - name: Build worker
        run: |
          echo "::group::Building worker"
          npm --workspace apps/worker run build
          echo "::endgroup::"

      - name: Lint web application
        run: |
          echo "::group::Linting web application"
          npm --workspace apps/web run lint
          echo "::endgroup::"

      - name: Build web application
        run: |
          echo "::group::Building web application"
          npm --workspace apps/web run build
          echo "::endgroup::"

      - name: Validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## LabCart — Application Validation"
            echo ""
            echo "- **Status:** ${JOB_STATUS}"
            echo "- **Node.js:** ${NODE_VERSION}"
            echo "- **API:** TypeScript build"
            echo "- **Worker:** TypeScript build"
            echo "- **Web:** ESLint and Vite production build"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════
  # JOB 2 — Build, scan and push Docker images
  # ═══════════════════════════════════════════
  build-scan-push:
    name: "2. Build, scan and push ${{ matrix.app }}"
    needs: validate

    # Pull requests validate code but do not publish images.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            repository: labcart/api

          - app: web
            repository: labcart/web

          - app: worker
            repository: labcart/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ───────────────────────────────────────
      # AWS authentication through GitHub OIDC
      # ───────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: LabCartGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ───────────────────────────────────────
      # Authenticate with Amazon ECR
      # ───────────────────────────────────────
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ───────────────────────────────────────
      # Prepare immutable image metadata
      # ───────────────────────────────────────
      - name: Set image metadata
        id: image
        env:
          ECR_REPOSITORY: ${{ matrix.repository }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          {
            echo "## LabCart — ${{ matrix.app }}"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Image:** \`${IMAGE_URI}\`"
            echo "- **Region:** \`${AWS_REGION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────────────────────────────────────
      # BuildKit and cache
      # ───────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.image.outputs.uri }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}


      # ───────────────────────────────────────
      # Final status
      # ───────────────────────────────────────
      - name: Publish success summary
        if: success()
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          {
            echo ""
            echo "### Result"
            echo "- **Build:** Passed"
            echo "- **Security scan:** Passed"
            echo "- **ECR push:** Completed"
            echo "- **Published image:** \`${IMAGE_URI}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          {
            echo ""
            echo "### Result"
            echo "- **Application:** ${{ matrix.app }}"
            echo "- **Status:** Failed"
            echo "- Review the failed step for build, AWS, ECR or security-scan details."
          } >> "$GITHUB_STEP_SUMMARY"
