apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: labcart
  labels:
    app: web
spec:
  replicas: 1

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: 223901279187.dkr.ecr.ap-south-1.amazonaws.com/labcart/web:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"